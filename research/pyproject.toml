[project]
name = "hlr"
version = "0.0.0"
description = "Research toolkit for the Hyperliquid market-data recorder (SPEC-0008). Never imported by or deployed with the bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "matplotlib",
    "orjson",
    "polars",
    "zstandard",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hlr-tardis-fetch = "hlr.backfill.tardis:main"
hlr-tardis-normalize = "hlr.backfill.tardis_normalize:main"

[tool.hatch.build.targets.wheel]
packages = ["hlr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
