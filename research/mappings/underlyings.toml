# Underlying mapping for the options / stock-perp studies (SPEC-0008 V-9).
#
# Source: live Hyperliquid HIP-3 metadata, 2026-09-28 (mainnet):
#   POST /info {"type":"perpDexs"}
#   POST /info {"type":"meta","dex":D} for every dex D in perpDexs
#
# Only currently-listed (isDelisted != true) markets are recorded in `hl`.
# As of 2026-09-28 the dexes with listed markets are xyz, para, io and mkts;
# flx, vntl, hyna, km, abcd and cash are fully delisted (empty l2Book) and are
# intentionally omitted. Re-run the V-9 probe before trusting this file.
#
# Schema (SPEC-0008 section 13.9 O9):
#   [UNDERLYING]
#   hl      = list of HL markets (main dex "BTC" or HIP-3 "dex:COIN")
#   options = Yahoo options symbol, "deribit:BTC|ETH", or "no-chain"
#   equity  = real equity/ETF symbol fed to O10, or "no-chain"
#
# Non-equity HIP-3 underlyings (commodities, FX, Treasury yields, crypto
# indices) are out of scope here and omitted: 10Y, 2Y, 30Y, BRENTOIL, BTCD, CL, COPPER, EUR, GBP, GOLD, JPY, NATGAS, OTHERS, PALLADIUM, PLATINUM, SILVER, TOTAL2.

