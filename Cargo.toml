[workspace]
resolver = "3"
members = [
    "crates/mev-bot",
    "crates/mev-core",
    "crates/mev-engine",
    "crates/mev-hl-client",
    "crates/mev-hyperevm",
    "crates/mev-metrics",
    "crates/mev-recorder",
    "crates/mev-risk",
    "crates/mev-strategy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/garyb9/mev-bot"

[workspace.dependencies]
mev-core = { path = "crates/mev-core" }
mev-engine = { path = "crates/mev-engine" }
mev-hl-client = { path = "crates/mev-hl-client" }
mev-hyperevm = { path = "crates/mev-hyperevm" }
mev-metrics = { path = "crates/mev-metrics" }
mev-recorder = { path = "crates/mev-recorder" }
mev-risk = { path = "crates/mev-risk" }
mev-strategy = { path = "crates/mev-strategy" }

rust_decimal = { version = "1.43", features = ["serde"] }

alloy-primitives = { version = "1", features = ["k256"] }
alloy-sol-types = "1"
k256 = "0.13"
rmp-serde = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
libc = "0.2"
zstd = "0.13"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union"] }
crossbeam-channel = "0.5"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }
secrecy = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = "0.19"
axum = "0.8"

[profile.release]
# Fat LTO: the workspace is small and its release artifact is the latency-
# critical production binary, so the extra link time is acceptable. E-12 set
# this (was `thin`); the final thin-vs-fat choice is gated by a reference-host
# bench (SPEC-0010 §18/§23 Q-E12-Reference-Host).
lto = "fat"
codegen-units = 1
panic = "abort"
