name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly (Mon 06:00 UTC) link-check + cargo-audit, plus manual runs.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      - run: cargo test --workspace --doc --locked

  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The toolchain is pinned by rust-toolchain.toml, so invoke it explicitly
      # (`cargo +1.90.0`) to check the `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +1.90.0 build --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  bench:
    name: bench (quick, warn-only)
    # Warn-only: never fails the workflow, and off the PR critical path.
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Self-check the baseline comparison script
        run: python3 scripts/bench_check.py --self-test
      # One CRITERION_HOME per bench target: some benchmark ids collide across
      # binaries (e.g. `decode/l2Book` exists in both the client and engine
      # benches), and a shared output dir would let the last writer overwrite
      # the first. An absolute path is required because the bench process runs
      # with its package directory as the working directory.
      - name: Quick-mode benchmarks
        env:
          MEV_BENCH_QUICK: "1"
        run: |
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/hl-decode" \
            cargo bench -p hl-arb-client --bench decode --locked -- --quick
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/hl-sign" \
            cargo bench -p hl-arb-client --bench sign --locked -- --quick
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/engine-ingest" \
            cargo bench -p hl-arb-engine --bench ingest --locked -- --quick
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/engine-iterate" \
            cargo bench -p hl-arb-engine --bench iterate --locked -- --quick
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/bot-engine" \
            cargo bench -p hl-arb-bot --bench engine --locked -- --quick
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion/recorder-segment" \
            cargo bench -p hl-arb-recorder --bench segment --locked -- --quick
      - name: Compare against baseline (warn-only)
        run: python3 scripts/bench_check.py
      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-criterion-quick
          # The per-target CRITERION_HOME dirs; keep in sync with the run above.
          path: |
            target/criterion/hl-decode
            target/criterion/hl-sign
            target/criterion/engine-ingest
            target/criterion/engine-iterate
            target/criterion/bot-engine
            target/criterion/recorder-segment
          retention-days: 30
          if-no-files-found: ignore

  audit:
    name: cargo audit (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.98.1"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  links:
    name: link check (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --accept 200,429 README.md docs/**/*.md
          fail: true
