# Default configuration (SPEC-0000 §7).
# Precedence: defaults here < config/{HL_ENV}.toml < HL_* env vars < CLI flags.

network = "mainnet"
mode = "observe"
autonomy = "auto"

# Bluechip watchlist; extend via CLI (`hl select --add ...`) or `--coins`.
watchlist = ["BTC", "ETH", "SOL"]

db_path = "data/hlbot.db"
# Kill-switch flag file (SPEC-0004 K-3); `hl panic` writes it, `hl resume` removes it.
# Override with HL_KILL_FILE.
kill_file = "data/KILL"
# Dead-man's switch TTL (SPEC-0002 H-4); refreshed at half this.
schedule_cancel_ttl_ms = 120000
http_port = 9090

[engine]
# Busy-spin before blocking on the input channels, in microseconds (0 = never).
spin_us = 50

[strategy]
# Enable market-making too with: enabled = ["funding_basis", "market_making"]
enabled = ["funding_basis"]
min_edge_bps = 5
# Slippage (bps) applied to aggressive (limit_px=None) orders, relative to the touch.
max_slippage_bps = 10

[strategy.market_making]
coins = ["ETH"]
levels = 3
half_spread_bps = 4
level_step_bps = 4
size_per_level = 0.05
max_inventory = 1.0
max_skew_bps = 4
vol_pull_bps = 30
refresh_bps = 2

[strategy.funding]
perp_coin = "BTC"
spot_pair = "UBTC/USDC"
spot_token = "UBTC"
target_notional_usd = 1000
horizon_hours = 24
exit_threshold_bps = 0
exit_after_hours = 3
rebalance_drift_bps = 100
maker = false
